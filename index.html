<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3f2928">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <title>Mai Anh &amp; Anh Tuan - Choose your language</title>
  <meta name="description" content="Mai Anh and Anh Tuan's wedding in Hanoi on December 24, 2026. Choose English or Tiếng Việt.">
  <link rel="canonical" href="https://tuan-and-mai-anh.github.io/">
  <link rel="alternate" hreflang="x-default" href="https://tuan-and-mai-anh.github.io/">
  <link rel="alternate" hreflang="en" href="https://tuan-and-mai-anh.github.io/en/">
  <link rel="alternate" hreflang="vi" href="https://tuan-and-mai-anh.github.io/vn/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mai Anh & Anh Tuan">
  <meta property="og:description" content="December 24, 2026 · Sheraton Hanoi Hotel">
  <meta property="og:url" content="https://tuan-and-mai-anh.github.io/">
  <meta property="og:image" content="https://tuan-and-mai-anh.github.io/assets/landing/language-selector-landscape-960.jpg">
  <meta property="og:image:width" content="960">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="Mai Anh and Anh Tuan together near the Eiffel Tower in Paris">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="vi_VN">
  <style>
    * { box-sizing: border-box; }
    html { background: #3f2928; }
    body.language-landing { margin: 0; }
    .language-landing-main { width: min(100%, 42.5rem); margin: 0 auto; }
    .language-landing-visual { aspect-ratio: 3 / 2; }
    .language-landing-visual img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    .language-landing-panel { text-align: center; }
    .language-landing-panel h1 { font-size: clamp(1.9rem, 8.5vw, 3.35rem); white-space: nowrap; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="language-landing">
  <main class="language-landing-main">
    <div class="language-landing-visual">
      <picture>
        <source
          type="image/webp"
          srcset="/assets/landing/language-selector-landscape-480.webp 480w, /assets/landing/language-selector-landscape-960.webp 960w"
          sizes="(max-width: 700px) 100vw, 680px">
        <img
          src="/assets/landing/language-selector-landscape-960.jpg"
          srcset="/assets/landing/language-selector-landscape-480.jpg 480w, /assets/landing/language-selector-landscape-960.jpg 960w"
          sizes="(max-width: 700px) 100vw, 680px"
          width="960"
          height="640"
          alt="Mai Anh and Anh Tuan together near the Eiffel Tower in Paris"
          fetchpriority="high"
          decoding="async">
      </picture>
    </div>
    <section class="language-landing-panel" aria-labelledby="landing-title">
      <h1 id="landing-title">Mai Anh <i>&amp;</i> Anh Tuan</h1>
      <p class="language-prompt">
        <span lang="en">Please choose your language</span>
        <span lang="vi">Vui lòng chọn ngôn ngữ</span>
      </p>
      <nav class="language-options" aria-label="Choose language / Chọn ngôn ngữ">
        <a class="language-option language-option-primary" href="/en/" lang="en" hreflang="en">
          <strong>English</strong>
          <span>View the wedding website</span>
        </a>
        <a class="language-option" href="/vn/" lang="vi" hreflang="vi">
          <strong>Tiếng Việt</strong>
          <span>Xem trang web đám cưới</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
